name: Disarm
options:
  bundleIdPrefix: com.omerbuyukcelik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  DisarmCore:
    path: Packages/DisarmCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9DDG73TKPX
targets:
  Disarm:
    type: application
    platform: iOS
    sources:
      - path: Disarm
    dependencies:
      - package: DisarmCore
    # Özel Info.plist anahtarları (INFOPLIST_KEY_ yalnızca Xcode'un bildiği anahtarları alır).
    # XcodeGen bu dosyayı üretir; Xcode INFOPLIST_KEY_ ayarlarını üstüne birleştirir.
    info:
      path: Disarm/Info.plist
      properties:
        # ProMotion: iPhone'da 60 Hz üstü çizim için gerekli; SpriteView 120 ister, ekran neyi veriyorsa onu alır.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Ağ yok, şifreleme yok: her yüklemede ihracat uyumluluğu sorusu çıkmasın.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omerbuyukcelik.disarm
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Disarm
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Disarm:
    build:
      targets:
        Disarm: all
    run:
      config: Debug
